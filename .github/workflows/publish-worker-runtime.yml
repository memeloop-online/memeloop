name: Publish worker runtime image

on:
  workflow_dispatch:
  push:
    tags:
      - "worker-runtime-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memeloop-worker-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve and validate image version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./packages/memeloop-worker-runtime/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "worker-runtime-v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match worker runtime version ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: packages/memeloop-worker-runtime
          file: packages/memeloop-worker-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployment coordinate
        shell: bash
        run: |
          {
            echo "### MemeLoop worker runtime"
            echo
            echo "\`${IMAGE_NAME}@${{ steps.image.outputs.digest }}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "${GITHUB_STEP_SUMMARY}"
