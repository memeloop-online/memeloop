name: Publish worker runtime image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA expected to be published
        required: true
        type: string
  push:
    tags:
      - "worker-runtime-v*"

concurrency:
  group: publish-worker-runtime
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/memeloop-worker-runtime
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve and validate image version
        id: version
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          version="$(node -p "require('./packages/memeloop-worker-runtime/package.json').version")"
          MEMELOOP_WORKER_VERSION="${version}" node scripts/validate-worker-publish-source.mjs
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable multi-architecture image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: packages/memeloop-worker-runtime
          file: packages/memeloop-worker-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployment coordinate
        shell: bash
        run: |
          {
            echo "### MemeLoop worker runtime"
            echo
            echo "\`${IMAGE_NAME}@${{ steps.image.outputs.digest }}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up pnpm for published-image acceptance
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.0.0

      - name: Set up Node 24 for published-image acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm

      - name: Build external-driver acceptance dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter memeloop build
          pnpm --filter memeloop-cli build
          pnpm --filter memeloop-k8s build
          pnpm --filter memeloop-swarm build

      - name: Verify the published digest on real Swarm and K3s
        shell: bash
        env:
          MEMELOOP_ACCEPTANCE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          MEMELOOP_DOCKER_CONFIG_FILE: ${{ runner.temp }}/memeloop-docker-config.json
          MEMELOOP_REQUIRE_CANONICAL_IMAGE: "true"
        run: |
          install -m 600 "${HOME}/.docker/config.json" "${MEMELOOP_DOCKER_CONFIG_FILE}"
          docker pull "${MEMELOOP_ACCEPTANCE_IMAGE}"
          node scripts/accept-external-clusters.mjs
