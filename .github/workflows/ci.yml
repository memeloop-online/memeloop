name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test:unit
      - name: Lint
        run: pnpm run lint
      - name: Portable package boundaries
        run: pnpm run check:boundaries
      - name: Packed package manifests
        run: pnpm run check:packages
      - name: memeloop-cli production-boundary E2E
        run: pnpm --filter memeloop-cli run test:e2e
