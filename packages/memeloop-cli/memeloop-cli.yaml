# MemeLoop CLI 配置文件

# LLM Providers
providers:
  - npm: "@ai-sdk/openai-compatible"
    name: "Westlake HPC"
    options:
      baseURL: "https://hpc-api.westlake.edu.cn/v1"
    models:
      minimax:
        name: "MiniMax M2.7"
        limit:
          context: 200000
          output: 65536
      glm:
        name: "GLM 4.7"
        limit:
          context: 200000
          output: 65536
      deepseek:
        name: "DeepSeek V4 Flash"
        limit:
          context: 128000
          output: 32768
      deepseek_pro:
        name: "DeepSeek V4 Pro"
        limit:
          context: 128000
          output: 65536
      gemma:
        name: "Gemma 4"
        limit:
          context: 128000
          output: 32768

auth:
  ws:
    enabled: true
    mode: lan-pin
    pin: '888888'
